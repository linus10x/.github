# Copy to .github/workflows/ci.yml. Pick one job and delete the other.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    uses: linus10x/.github/.github/workflows/reusable-python-ci.yml@main
    with:
      python-version: "3.12"
